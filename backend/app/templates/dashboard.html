<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>냉장고 재고 대시보드 (백엔드)</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e2e5eb;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #3b6fe0;
  }
  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .actions { display: flex; gap: 8px; align-items: center; }
  select, button {
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status { font-size: 13px; color: var(--muted); margin: 12px 0; }
  .door-badge {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .door-badge.open { background: #fff4e0; color: #b8720a; }
  .door-badge.closed { background: #e8f8ee; color: #1f8a4c; }
  .door-badge.unknown { background: var(--border); color: var(--muted); }

  .section h2 {
    font-size: 15px;
    color: var(--accent);
    margin: 26px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .cat-block { margin-bottom: 18px; }
  .cat-title {
    font-size: 13px;
    color: #1f8a4c;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .items { display: flex; flex-wrap: wrap; gap: 10px; }
  .card {
    display: flex;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 160px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card .thumb {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .card .body { min-width: 0; }
  .card .name { font-size: 15px; font-weight: 700; }
  .card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .card .badges { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 6px;
    font-size: 10px;
  }
  .badge.high { background: #e8f8ee; color: #1f8a4c; }
  .badge.medium { background: #fff4e0; color: #b8720a; }
  .badge.low { background: #fdeaea; color: #c0392b; }
  .badge.status-removed { background: #fdeaea; color: #c0392b; }
  .badge.status-in_fridge { background: #eaf1fd; color: #3b6fe0; }

  .alert-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid #aab0bb;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .alert-row.warning { border-left-color: #d3a04c; }
  .alert-row.critical { border-left-color: #e07a7a; }
  .alert-row.info { border-left-color: #3b6fe0; }
  .alert-time { color: var(--muted); font-size: 11px; white-space: nowrap; }

  #empty { margin-top: 30px; text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div>
      <h1>🧊 냉장고 재고 대시보드</h1>
      <div class="meta">백엔드: FastAPI ({{ base_url }})</div>
    </div>
    <div class="actions">
      <span id="doorStatus" class="door-badge unknown">🚪 확인 중...</span>
      <select id="statusFilter" onchange="load()">
        <option value="in_fridge">현재 냉장고 안</option>
        <option value="removed">반출됨</option>
        <option value="">전체</option>
      </select>
      <button class="primary" onclick="load()">새로고침</button>
    </div>
  </div>
  <div id="status"></div>

  <div class="section">
    <h2>재고</h2>
    <div id="items"></div>
    <div id="empty" style="display:none;">항목이 없습니다.</div>
  </div>

  <div class="section">
    <h2>최근 알림</h2>
    <div id="alerts"></div>
  </div>
</div>

<script>
const FOOD_CATEGORIES = ["야채", "과일", "유제품", "육류", "해산물", "음료", "소스/조미료", "기타"];

function fmtTime(iso) {
  try {
    const d = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
    return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return iso; }
}

async function load() {
  const status = document.getElementById('status');
  const itemsBox = document.getElementById('items');
  const emptyBox = document.getElementById('empty');
  const alertsBox = document.getElementById('alerts');
  const statusFilter = document.getElementById('statusFilter').value;

  status.textContent = '불러오는 중...';
  try {
    const [itemsRes, alertsRes] = await Promise.all([
      fetch(`/api/items?status=${encodeURIComponent(statusFilter)}`),
      fetch('/api/alerts'),
    ]);
    const items = await itemsRes.json();
    const alerts = await alertsRes.json();

    itemsBox.innerHTML = '';
    if (items.length === 0) {
      emptyBox.style.display = 'block';
    } else {
      emptyBox.style.display = 'none';
      const groups = {};
      for (const item of items) {
        (groups[item.class_name] = groups[item.class_name] || []).push(item);
      }
      const orderedCats = [
        ...FOOD_CATEGORIES.filter(c => groups[c]),
        ...Object.keys(groups).filter(c => !FOOD_CATEGORIES.includes(c)),
      ];
      for (const cat of orderedCats) {
        const block = document.createElement('div');
        block.className = 'cat-block';
        const title = document.createElement('div');
        title.className = 'cat-title';
        title.textContent = `${cat} (${groups[cat].length})`;
        block.appendChild(title);

        const row = document.createElement('div');
        row.className = 'items';
        for (const item of groups[cat]) {
          const card = document.createElement('div');
          card.className = 'card';
          const thumbHtml = item.image_url
            ? `<img class="thumb" src="${item.image_url}" alt="${item.label}">`
            : `<div class="thumb"></div>`;
          card.innerHTML = `
            ${thumbHtml}
            <div class="body">
              <div class="name">${item.label}</div>
              <div class="sub">투입 ${fmtTime(item.entry_date)} · 출처 ${item.source}</div>
              <div class="badges">
                <span class="badge ${item.confidence || ''}">${item.confidence || '-'}</span>
                <span class="badge status-${item.status}">${item.status}</span>
              </div>
            </div>
          `;
          row.appendChild(card);
        }
        block.appendChild(row);
        itemsBox.appendChild(block);
      }
    }

    alertsBox.innerHTML = '';
    if (alerts.length === 0) {
      alertsBox.innerHTML = '<div style="color:var(--muted);font-size:13px;">알림 없음</div>';
    } else {
      for (const a of alerts) {
        const row = document.createElement('div');
        row.className = 'alert-row ' + a.severity;
        row.innerHTML = `
          <div>
            <strong>[${a.alert_type}]</strong> ${a.message}
          </div>
          <div class="alert-time">${fmtTime(a.created_at)}</div>
        `;
        alertsBox.appendChild(row);
      }
    }

    status.textContent = '';
  } catch (e) {
    status.textContent = '불러오기 실패: ' + (e.message || e);
  }
}

function applyDoorState(door) {
  const doorBadge = document.getElementById('doorStatus');
  if (door.is_open === true) {
    doorBadge.textContent = '🚪 문 열림';
    doorBadge.className = 'door-badge open';
  } else if (door.is_open === false) {
    doorBadge.textContent = '🚪 문 닫힘';
    doorBadge.className = 'door-badge closed';
  } else {
    doorBadge.textContent = '🚪 상태 알 수 없음';
    doorBadge.className = 'door-badge unknown';
  }
}

function connectDoorStream() {
  const es = new EventSource('/api/door/stream');
  es.onmessage = (evt) => {
    try { applyDoorState(JSON.parse(evt.data)); } catch (e) { /* 무시 */ }
  };
  es.onerror = () => {
    const doorBadge = document.getElementById('doorStatus');
    doorBadge.textContent = '🚪 연결 끊김 (재연결 시도 중...)';
    doorBadge.className = 'door-badge unknown';
  };
}

load();
setInterval(load, 5000);
connectDoorStream();
</script>
</body>
</html>
